services:
  web:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      APP_URL: https://${SITE_DOMAIN:?请在.env设置SITE_DOMAIN}
      TRUST_PROXY: "1"
      DISABLE_WEB_SETUP: "1"
      IRIS_BASE_URL: ${IRIS_BASE_URL:-http://host.docker.internal:8000}
      IRIS_API_TOKEN: ${IRIS_API_TOKEN:-}
      DATA_DIR: /app/data
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在.env设置SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  caddy_data:
  caddy_config:
